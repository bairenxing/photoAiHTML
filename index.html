<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>抖音动图水印去除</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#1c1c1e;min-height:100vh;padding:20px 16px}
.wrap{max-width:700px;margin:0 auto}
h1{font-size:18px;font-weight:700;margin-bottom:3px}
.sub{font-size:12px;color:#8e8e93;margin-bottom:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.drop{border:2px dashed #c7c7cc;border-radius:10px;padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:#f5f5f5;border-color:#aaa}
.drop input{display:none}
.drop-icon{font-size:36px;margin-bottom:8px}
.drop-title{font-size:15px;font-weight:500;margin-bottom:4px}
.drop-sub{font-size:12px;color:#8e8e93}
.ctrl-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cg{flex:1;min-width:130px}
.cg label{font-size:11px;color:#8e8e93;display:flex;justify-content:space-between;margin-bottom:3px}
.cg input[type=range]{width:100%;accent-color:#007aff}
.prev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pbox{border-radius:8px;overflow:hidden;border:1px solid #e5e5ea;background:#111;position:relative}
.pbox canvas{width:100%;display:block}
.plabel{font-size:10px;color:#8e8e93;padding:3px 8px;text-align:center;background:#fafafa;border-top:1px solid #eee}
.mask-ov{position:absolute;background:rgba(255,59,48,.22);pointer-events:none;border:2px solid rgba(255,59,48,.9)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;background:#007aff;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prog-wrap{margin-top:12px;display:none}
.prog-bg{background:#e5e5ea;border-radius:4px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:#007aff;width:0%;transition:width .08s;border-radius:4px}
.prog-text{font-size:11px;color:#8e8e93;margin-top:4px}
.logbox{font-size:12px;line-height:1.9;margin-top:10px;min-height:16px}
.logbox .ok{color:#34c759}.logbox .err{color:#ff3b30}.logbox .warn{color:#ff9500}.logbox .info{color:#8e8e93}
.result{display:none;margin-top:12px;padding:14px;background:#e8f5e9;border-radius:10px;border:1px solid #a5d6a7}
.result .rt{font-size:14px;font-weight:600;color:#2e7d32;margin-bottom:6px}
.result .rs{font-size:12px;color:#555;line-height:1.7}
.dl-btn{display:inline-flex;align-items:center;gap:6px;background:#34c759;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;text-decoration:none}
.tip{font-size:12px;color:#8e8e93;background:#f9f9f9;border-radius:8px;padding:10px;margin-top:10px;border:1px solid #eee;line-height:1.7}
@media(max-width:480px){.prev-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 抖音动图水印去除</h1>
  <p class="sub">上传抖音动态 JPEG · 自动提取内嵌视频 · 去除水印 · 输出动图</p>

  <div class="card">
    <div class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/jpeg,image/jpg,.jpg,.jpeg,video/*,image/gif">
      <div class="drop-icon">📷</div>
      <div class="drop-title">点击上传抖音动态图片</div>
      <div class="drop-sub">.jpg / .jpeg 动态照片，也支持 MP4、GIF</div>
    </div>
    <div class="logbox" id="ulog"></div>
  </div>

  <div class="card" id="settingCard" style="display:none">
    <div class="ctrl-row">
      <div class="cg"><label>水印宽度 <span id="wV">22%</span></label><input type="range" id="mW" min="5" max="60" value="22"></div>
      <div class="cg"><label>水印高度 <span id="hV">10%</span></label><input type="range" id="mH" min="3" max="40" value="10"></div>
      <div class="cg"><label>模糊强度 <span id="bV">22</span></label><input type="range" id="bR" min="6" max="50" value="22"></div>
    </div>
    <div class="prev-grid">
      <div class="pbox"><canvas id="pC"></canvas><div id="mOv" class="mask-ov"></div><div class="plabel">原帧（红框=水印）</div></div>
      <div class="pbox"><canvas id="rC"></canvas><div class="plabel">处理后效果</div></div>
    </div>
    <button class="btn" id="startBtn">▶ 开始处理，导出无水印动图</button>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-bg"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-text" id="progText"></div>
    </div>
    <div class="logbox" id="plog"></div>
    <div class="result" id="result">
      <div class="rt">🎉 处理完成！</div>
      <div class="rs" id="rDesc"></div>
      <a class="dl-btn" id="dlBtn">⬇ 下载无水印动图</a>
    </div>
    <div class="tip">
      💡 <b>输出格式说明</b>：<br>
      • 抖音动态 JPEG / MP4 → 输出 <b>WebM 视频</b>（Chrome 录制最稳定）<br>
      • 手机可直接播放 WebM；如需 MP4 可用 <a href="https://cloudconvert.com/webm-to-mp4" target="_blank">CloudConvert</a> 免费转换<br>
      • GIF → 输出处理后的 <b>GIF</b>（需要 gifshot 库，自动加载）
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const dropZone=$('dropZone'), fileInput=$('fileInput');
const ulog=$('ulog'), plog=$('plog');
const settingCard=$('settingCard');
const mW=$('mW'), mH=$('mH'), bR=$('bR');
const wV=$('wV'), hV=$('hV'), bV=$('bV');
const pC=$('pC'), rC=$('rC'), mOv=$('mOv');
const startBtn=$('startBtn');
const progWrap=$('progWrap'), progFill=$('progFill'), progText=$('progText');
const result=$('result'), rDesc=$('rDesc'), dlBtn=$('dlBtn');

let videoEl=null, inputType='', gifFrames=[], videoBlob=null;

// ── 上传 ──
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('over');if(e.dataTransfer.files[0])go(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])go(fileInput.files[0]);});
[mW,mH,bR].forEach(el=>el.addEventListener('input',()=>{wV.textContent=mW.value+'%';hV.textContent=mH.value+'%';bV.textContent=bR.value;refreshPreview();}));

function ul(msg,cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=msg;ulog.appendChild(d);}
function pl(msg,cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=msg;plog.appendChild(d);}
function prog(pct,txt){progFill.style.width=pct+'%';progText.textContent=txt;}

// ── 主流程 ──
function go(file){
  ulog.innerHTML=''; plog.innerHTML=''; result.style.display='none';
  gifFrames=[]; videoBlob=null; videoEl=null;
  settingCard.style.display='none';
  const isJpeg=/image\/jpe?g/i.test(file.type)||/\.jpe?g$/i.test(file.name);
  const isGif=file.type==='image/gif';
  ul('📄 '+file.name+' · '+(file.size/1024).toFixed(0)+' KB');
  if(isJpeg){ inputType='motionphoto'; extractMP4(file); }
  else if(isGif){ inputType='gif'; loadGif(file); }
  else { inputType='video'; loadVideoBlob(new Blob([file],{type:file.type})); }
}

// ══ 提取 MP4 ══
function extractMP4(file){
  ul('🔍 分析文件结构…','info');
  const reader=new FileReader();
  reader.onload=e=>{
    const buf=e.target.result;
    const u8=new Uint8Array(buf);
    const size=u8.length;

    // 1) XMP MicroVideoOffset
    let start=findByXMP(buf,size);
    // 2) ftyp magic bytes
    if(start<0) start=findFtyp(u8);
    // 3) JPEG EOI 后面
    if(start<0) start=findAfterEOI(u8);

    if(start>0 && start<size-64){
      const vbytes=u8.slice(start);
      ul('✅ 找到内嵌视频，起始字节='+start+'，大小='+(vbytes.length/1024).toFixed(0)+' KB','ok');
      videoBlob=new Blob([vbytes],{type:'video/mp4'});
      loadVideoBlob(videoBlob);
    } else {
      ul('⚠️ 未找到内嵌视频，按静态图片处理','warn');
      inputType='staticjpeg';
      loadStaticJpeg(file);
    }
  };
  reader.readAsArrayBuffer(file);
}

function findByXMP(buf,size){
  const scan=Math.min(131072,buf.byteLength);
  const u8=new Uint8Array(buf,0,scan);
  let s='';for(let i=0;i<scan;i++)s+=String.fromCharCode(u8[i]);
  const patterns=[
    /MicroVideoOffset\s*=\s*["']?(\d+)/,
    /GCamera:MicroVideoOffset\s*=\s*["']?(\d+)/,
    /microVideoOffset\s*=\s*["']?(\d+)/,
  ];
  for(const p of patterns){
    const m=s.match(p);
    if(m){const off=parseInt(m[1]);if(off>0){ul('📋 XMP MicroVideoOffset='+off,'info');return size-off;}}
  }
  return -1;
}
function findFtyp(u8){
  for(let i=4;i<u8.length-8;i++){
    if(u8[i]===0x66&&u8[i+1]===0x74&&u8[i+2]===0x79&&u8[i+3]===0x70){
      ul('📋 ftyp 标记位于字节 '+(i-4),'info');
      return i-4;
    }
  }
  return -1;
}
function findAfterEOI(u8){
  // 从后往前找最后一个 FFD9
  for(let i=u8.length-2;i>64;i--){
    if(u8[i]===0xFF&&u8[i+1]===0xD9&&i+2<u8.length-64){
      ul('📋 JPEG EOI 后附加数据，偏移='+(i+2),'info');
      return i+2;
    }
  }
  return -1;
}

// ══ 视频加载 ══
function loadVideoBlob(blob){
  if(videoEl){try{videoEl.pause();}catch(e){}}
  videoEl=document.createElement('video');
  videoEl.muted=true; videoEl.playsInline=true; videoEl.preload='auto';
  videoEl.src=URL.createObjectURL(blob);
  videoEl.addEventListener('loadedmetadata',()=>{
    ul('✅ 视频就绪：'+videoEl.videoWidth+'×'+videoEl.videoHeight+' · '+videoEl.duration.toFixed(1)+'秒','ok');
    settingCard.style.display='block';
    refreshPreview();
  });
  videoEl.addEventListener('error',()=>ul('❌ 视频解码失败。请先用手机"存储为视频"后再上传。','err'));
  videoEl.load();
}

function loadStaticJpeg(file){
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=img.naturalWidth;c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    gifFrames=[c];
    ul('🖼 静态图片 '+img.naturalWidth+'×'+img.naturalHeight,'ok');
    settingCard.style.display='block';
    refreshPreview();
  };
  img.src=URL.createObjectURL(file);
}

function loadGif(file){
  ul('⏳ 加载 GIF 库…','info');
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/libgif/0.0.3/libgif.min.js';
  s.onload=()=>parseGif(file);
  s.onerror=()=>ul('❌ GIF 库加载失败','err');
  document.head.appendChild(s);
}
function parseGif(file){
  const img=new Image();
  img.src=URL.createObjectURL(file);
  img.style.cssText='position:absolute;left:-9999px';
  document.body.appendChild(img);
  const sg=new SuperGif({gif:img,auto_play:false});
  sg.load(()=>{
    gifFrames=[];
    for(let i=0;i<sg.get_length();i++){sg.move_to(i);const s=sg.get_canvas();const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(s,0,0);gifFrames.push(c);}
    img.remove();
    ul('✅ GIF '+gifFrames.length+'帧','ok');
    settingCard.style.display='block';
    refreshPreview();
  });
}

// ══ 预览 ══
function getDims(){
  if(gifFrames.length) return{w:gifFrames[0].width,h:gifFrames[0].height};
  if(videoEl) return{w:videoEl.videoWidth||320,h:videoEl.videoHeight||568};
  return{w:320,h:568};
}
function getMask(vw,vh){
  const mw=Math.round(vw*parseInt(mW.value)/100);
  const mh=Math.round(vh*parseInt(mH.value)/100);
  return{x:vw-mw,y:vh-mh,w:mw,h:mh};
}
function blur(ctx,vw,vh){
  const r=getMask(vw,vh),b=parseInt(bR.value);
  for(let p=0;p<3;p++){
    const id=ctx.getImageData(0,0,vw,vh);
    const t=document.createElement('canvas');t.width=vw;t.height=vh;t.getContext('2d').putImageData(id,0,0);
    ctx.save();ctx.filter='blur('+b+'px)';ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();ctx.drawImage(t,0,0);ctx.restore();
  }
}
function drawProcessed(cv,src,vw,vh){cv.width=vw;cv.height=vh;const ctx=cv.getContext('2d');ctx.drawImage(src,0,0,vw,vh);blur(ctx,vw,vh);}
function refreshPreview(){
  const{w:vw,h:vh}=getDims();if(!vw||!vh)return;
  const src=gifFrames.length?gifFrames[0]:videoEl;
  if(!src)return;
  const doIt=()=>{
    pC.width=vw;pC.height=vh;pC.getContext('2d').drawImage(src,0,0,vw,vh);
    drawProcessed(rC,src,vw,vh);
    updateOv(vw,vh);
  };
  if(videoEl&&!gifFrames.length){
    videoEl.currentTime=videoEl.duration>1?1:0;
    videoEl.onseeked=doIt;
  } else doIt();
}
function updateOv(vw,vh){
  requestAnimationFrame(()=>{
    const pw=pC.offsetWidth,ph=pC.offsetHeight;if(!pw||!ph)return;
    const r=getMask(vw,vh),sx=pw/vw,sy=ph/vh;
    mOv.style.cssText='left:'+Math.round(r.x*sx)+'px;top:'+Math.round(r.y*sy)+'px;width:'+Math.round(r.w*sx)+'px;height:'+Math.round(r.h*sy)+'px';
  });
}

// ══ 导出 ══
startBtn.addEventListener('click',()=>{
  plog.innerHTML='';result.style.display='none';
  if(inputType==='staticjpeg') doStaticJpeg();
  else if(inputType==='gif') doGifExport();
  else doVideoExport();
});

// 静态图
function doStaticJpeg(){
  const{w:vw,h:vh}=getDims();
  const c=document.createElement('canvas');c.width=vw;c.height=vh;
  const ctx=c.getContext('2d');ctx.drawImage(gifFrames[0],0,0,vw,vh);blur(ctx,vw,vh);
  c.toBlob(b=>finish(b,'no_watermark.jpg'),'image/jpeg',0.95);
}

// ══ 视频：逐帧 seek 方式（最稳定）══
function doVideoExport(){
  if(!videoEl){pl('❌ 视频未就绪','err');return;}
  startBtn.disabled=true;
  progWrap.style.display='block';

  const fps=30;
  const dur=videoEl.duration;
  const totalFrames=Math.ceil(dur*fps);
  const{w:vw,h:vh}=getDims();

  pl('📐 '+vw+'×'+vh+' · '+dur.toFixed(2)+'秒 · 预计'+totalFrames+'帧','info');
  pl('⚙️ 逐帧截取中，请勿关闭页面…','info');

  // 用 OffscreenCanvas + captureStream 录制
  const offCV=document.createElement('canvas');
  offCV.width=vw;offCV.height=vh;
  const offCtx=offCV.getContext('2d');

  // 选最佳 mime
  const mimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
  pl('🎞 录制格式：'+mime,'info');

  const stream=offCV.captureStream(fps);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    pl('✅ 录制完成：'+(blob.size/1024).toFixed(0)+' KB','ok');
    prog(100,'完成！');
    startBtn.disabled=false;
    finish(blob,'no_watermark.webm');
  };

  rec.start();

  let frameIdx=0;
  const interval=1/fps;

  function seekNext(){
    if(frameIdx>=totalFrames){
      // 最后再画一帧确保结尾
      rec.stop();
      return;
    }
    const t=frameIdx*interval;
    prog(Math.round(frameIdx/totalFrames*100),'处理帧 '+frameIdx+'/'+totalFrames+' ('+t.toFixed(2)+'s)');
    videoEl.currentTime=Math.min(t,dur-0.001);
    frameIdx++;
  }

  videoEl.onseeked=()=>{
    // 把当前帧画到 offscreen canvas（加水印模糊）
    offCtx.drawImage(videoEl,0,0,vw,vh);
    blur(offCtx,vw,vh);
    // 等一个 rAF 让 captureStream 捕获这帧
    requestAnimationFrame(()=>{
      setTimeout(seekNext, Math.round(1000/fps));
    });
  };

  // 开始
  seekNext();
}

// ══ GIF 导出 ══
function doGifExport(){
  startBtn.disabled=true;
  progWrap.style.display='block';
  const{w:vw,h:vh}=getDims();
  const off=document.createElement('canvas');off.width=vw;off.height=vh;
  const octx=off.getContext('2d');
  const frames=[];

  function nextF(i){
    if(i>=gifFrames.length){buildGifOrZip(frames,vw,vh);return;}
    octx.clearRect(0,0,vw,vh);
    octx.drawImage(gifFrames[i],0,0,vw,vh);
    blur(octx,vw,vh);
    frames.push(off.toDataURL('image/png'));
    prog(Math.round((i+1)/gifFrames.length*80),'处理帧 '+(i+1)+'/'+gifFrames.length);
    setTimeout(()=>nextF(i+1),0);
  }
  nextF(0);
}

function buildGifOrZip(frames,vw,vh){
  // 尝试用 gifshot 生成真正的 GIF
  prog(82,'生成 GIF…');
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.4.5/gifshot.min.js';
  s.onload=()=>{
    gifshot.createGIF({
      images:frames,
      gifWidth:vw,gifHeight:vh,
      interval:0.08,numWorkers:2,
      progressCallback:p=>prog(82+Math.round(p*18),'编码 GIF '+Math.round(p*100)+'%')
    },obj=>{
      if(!obj.error){
        // base64 -> blob
        const b64=obj.image.split(',')[1];
        const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        finish(new Blob([arr],{type:'image/gif'}),'no_watermark.gif');
        pl('✅ GIF 生成完成','ok');
      } else {
        pl('⚠️ GIF 生成失败，改为 ZIP 导出: '+obj.error,'warn');
        exportZip(frames);
      }
      startBtn.disabled=false;
    });
  };
  s.onerror=()=>exportZip(frames);
  document.head.appendChild(s);
}

function exportZip(urls){
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  s.onload=()=>{
    const zip=new JSZip();
    urls.forEach((d,i)=>zip.file('frame_'+String(i).padStart(4,'0')+'.png',d.split(',')[1],{base64:true}));
    zip.generateAsync({type:'blob'}).then(b=>{
      finish(b,'gif_frames.zip');
      pl('📦 帧序列 ZIP 已导出，可上传到 <a href="https://ezgif.com/maker" target="_blank">ezgif.com</a> 合成 GIF','ok');
      startBtn.disabled=false;
    });
  };
  document.head.appendChild(s);
}

// ══ 下载 ══
function finish(blob,filename){
  const url=URL.createObjectURL(blob);
  dlBtn.href=url; dlBtn.download=filename;
  rDesc.textContent=filename+' · '+(blob.size/1024).toFixed(0)+' KB';
  result.style.display='block';
  // 自动下载
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>document.body.removeChild(a),1000);
}

})();
</script>
</body>
</html>
